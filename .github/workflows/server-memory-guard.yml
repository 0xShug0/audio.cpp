name: server lifecycle cross-platform

# Verifies server memory management and parallel-session lifecycle changes
# compile and the focused unit tests pass on all three
# desktop platforms. GPU backends are disabled here: the changes themselves are
# backend-agnostic (they query memory through ggml_backend_dev_memory), and the
# existing linux/mac/windows workflows already cover CUDA/Vulkan/Metal builds.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/server/**"
      - "src/framework/core/host_memory.cpp"
      - "include/engine/framework/core/backend.h"
      - "src/framework/core/backend.cpp"
      - "tests/unittests/test_server_config.cpp"
      - "include/engine/framework/runtime/parallel_session.h"
      - "include/engine/framework/runtime/session_pool.h"
      - "include/engine/framework/runtime/session.h"
      - "tests/unittests/test_server_model_slots.cpp"
      - "tests/unittests/test_session_pool.cpp"
      - "tests/unittests/test_server_busy_guard.cpp"
      - ".github/workflows/server-memory-guard.yml"

jobs:
  build-test:
    name: ${{ matrix.os }} build+test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOCPP_VERSION=ci \
            -DENGINE_BUILD_TESTS=ON \
            -DENGINE_BUILD_EXTENDED_TESTS=ON \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DENGINE_ENABLE_CUDA=OFF \
            -DENGINE_ENABLE_VULKAN=OFF \
            -DENGINE_ENABLE_METAL=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="/utf-8 /EHsc" `
            -DAUDIOCPP_VERSION=ci `
            -DENGINE_BUILD_TESTS=ON `
            -DENGINE_BUILD_EXTENDED_TESTS=ON `
            -DENGINE_ENABLE_OPENMP=OFF `
            -DENGINE_ENABLE_CUDA=OFF `
            -DENGINE_ENABLE_VULKAN=OFF `
            -DENGINE_ENABLE_METAL=OFF

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target audiocpp_server server_config_test server_busy_guard_test server_single_slot_compat_test server_model_slots_test session_pool_test --parallel "$(nproc)"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --build build --target audiocpp_server server_config_test server_busy_guard_test server_single_slot_compat_test server_model_slots_test session_pool_test --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --target audiocpp_server server_config_test server_busy_guard_test server_single_slot_compat_test server_model_slots_test session_pool_test --parallel

      - name: Run server lifecycle tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure -R '^(server_config_test|server_busy_guard_test|server_single_slot_compat_test|server_model_slots_test|session_pool_test)$' --parallel 4

      - name: Run server lifecycle tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir build --build-config Release --output-on-failure -R '^(server_config_test|server_busy_guard_test|server_single_slot_compat_test|server_model_slots_test|session_pool_test)$' --parallel 4

# audio.cpp — release.yml
#
# Modeled on llama.cpp's release workflow but stripped to the backends audio.cpp
# ships (CPU, CUDA, Vulkan, Metal). Windows artifacts are packed with 7-Zip (zip
# is not on Windows runners); Linux/macOS use tar. Windows CUDA builds are a
# 2-version matrix (12.4 / 13.3) that configure CMake directly with OpenMP off
# (audio.cpp's build_windows.ps1 hard-requires OpenMP and asserts on the CUDA
# toolchain), matching how llama.cpp decouples backend builds.
#
# Triggers on manual dispatch or a push to `main` touching source files. A commit
# message containing "[no release]" skips the release (same gate as llama.cpp).

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/CMakeLists.txt'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.metal'

env:
  GH_TOKEN: ${{ github.token }}
  BUILD_TARGETS: audiocpp_cli audiocpp_server audiocpp_gguf
  VULKAN_VERSION: '1.4.357.0'
  CMAKE_ARGS: "-DAUDIOCPP_DEPLOYMENT_BUILD=ON -DENGINE_ENABLE_LLAMAFILE=ON -DENGINE_ENABLE_CUDA_GRAPHS=ON"

concurrency:
  group: release
  queue: max

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if echo "$COMMIT_MESSAGE" | grep -q '\[no release\]'; then
              echo "should_release=false" >> "$GITHUB_OUTPUT"
            else
              echo "should_release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    needs: check-release
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [[ -n "$TAG" ]]; then
            echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)-$(date +%s)" >> "$GITHUB_OUTPUT"
          fi
  macos-metal:
    name: macOS (${{ matrix.build }})
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: 'arm64'
            arch: 'arm64'
            os: macos-26
            defines: '-DGGML_METAL=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF'
          - build: 'x64'
            arch: 'x64'
            os: macos-15-intel
            # Metal disabled on x64 (GitHub Intel runners have no usable GPU)
            defines: '-DGGML_METAL=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3 -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_RPATH='@loader_path' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF \
            ${{ matrix.defines }} ${{ env.CMAKE_ARGS }}
      - name: Build
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.logicalcpu)" --target ${{ env.BUILD_TARGETS }}
      - name: Pack
        run: |
          cp LICENSE build/bin/ 2>/dev/null || true
          tar -czvf audio-${{ needs.get-version.outputs.version }}-bin-macos-${{ matrix.arch }}-metal.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-macos-${{ matrix.arch }}-metal
          path: audio-${{ needs.get-version.outputs.version }}-bin-macos-${{ matrix.arch }}-metal.tar.gz

  linux-cpu:
    name: Ubuntu x64 (CPU)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make glslc libvulkan-dev spirv-headers
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=OFF ${{ env.CMAKE_ARGS }}
      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)" --target ${{ env.BUILD_TARGETS }}
      - name: Pack
        run: |
          cp LICENSE build/bin/ 2>/dev/null || true
          tar -czf audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-cpu.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-cpu
          path: audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-cpu.tar.gz

  linux-vulkan:
    name: Ubuntu x64 (Vulkan)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake make glslc libvulkan-dev spirv-headers
      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_VULKAN=ON ${{ env.CMAKE_ARGS }}
      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)" --target ${{ env.BUILD_TARGETS }}
      - name: Pack
        run: |
          cp LICENSE build/bin/ 2>/dev/null || true
          tar -czf audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-vulkan.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-vulkan
          path: audio-${{ needs.get-version.outputs.version }}-bin-ubuntu-x64-vulkan.tar.gz
  windows-cpu:
    name: Windows x64 (CPU)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -Preset windows-cpu-release -Target audiocpp_cli
          .\scripts\build_windows.ps1 -Preset windows-cpu-release -Target audiocpp_server
          .\scripts\build_windows.ps1 -Preset windows-cpu-release -Target audiocpp_gguf
      - name: Pack
        shell: pwsh
        working-directory: build/windows-cpu-release/bin
        run: |
          cp ..\..\..\LICENSE . 2>$null
          7z a -snl ..\..\..\audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-cpu.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-cpu
          path: audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-cpu.zip

  windows-vulkan:
    name: Windows x64 (Vulkan)
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\\VulkanSDK\\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\\VulkanSDK\\${env:VULKAN_VERSION}\\bin"
      - name: Build
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1 -Preset windows-vulkan-release -Target audiocpp_cli
          .\scripts\build_windows.ps1 -Preset windows-vulkan-release -Target audiocpp_server
          .\scripts\build_windows.ps1 -Preset windows-vulkan-release -Target audiocpp_gguf
      - name: Pack
        shell: pwsh
        working-directory: build/windows-vulkan-release/bin
        run: |
          cp ..\..\..\LICENSE . 2>$null
          7z a -snl ..\..\..\audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-vulkan.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-vulkan
          path: audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-vulkan.zip

  windows-cuda:
    name: 'Windows x64 (CUDA ${{ matrix.label }})'
    needs: [check-release, get-version]
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '12.4.1'
            label: '12.4'
          - cuda: '13.2.0'
            label: '13.2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CUDA build tools
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: 'local'
      - name: Configure (OpenMP off)
        shell: pwsh
        # Direct CMake (bypass build_windows.ps1, which hard-requires OpenMP and
        # aborts under the CUDA toolchain). OpenMP off matches how llama.cpp
        # builds the CUDA path.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DENGINE_ENABLE_CUDA=ON -DENGINE_ENABLE_OPENMP=OFF -DGGML_OPENMP=OFF `
            -DENGINE_ENABLE_CUDA_GRAPHS=ON -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_METAL=OFF `
            -DENGINE_ENABLE_LLAMAFILE=ON -DENGINE_ENABLE_NATIVE_CPU=ON -DENGINE_BUILD_TESTS=OFF `
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON -DCUDAToolkit_ROOT="$env:CUDA_PATH"
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS --target ${{ env.BUILD_TARGETS }}
      - name: Bundle CUDA runtime
        shell: pwsh
        run: |
          $dst = "build\bin\cudart"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          robocopy "$env:CUDA_PATH\bin" $dst cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          exit $LASTEXITCODE
      - name: Pack
        shell: pwsh
        working-directory: build/bin
        run: |
          cp ..\..\LICENSE . 2>$null
          7z a -snl ..\..\..\audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-cuda${{ matrix.label }}.zip * cudart\*
          7z a -snl ..\..\..\audio-${{ needs.get-version.outputs.version }}-cudart-windows-x64-cuda${{ matrix.label }}.zip cudart\*
      - uses: actions/upload-artifact@v4
        with:
          name: audio-${{ needs.get-version.outputs.version }}-bin-windows-x64-cuda${{ matrix.label }}
          path: 'audio-${{ needs.get-version.outputs.version }}-*cuda${{ matrix.label }}.zip'

  release:
    name: Create release
    needs:
      - check-release
      - get-version
      - macos-metal
      - linux-cpu
      - linux-vulkan
      - windows-cpu
      - windows-vulkan
      - windows-cuda
    if: ${{ needs.check-release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: ${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: assets/**


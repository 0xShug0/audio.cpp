name: Release packages

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            backend: cpu
          - arch: x86_64
            runner: ubuntu-24.04
            backend: vulkan
          - arch: aarch64
            runner: ubuntu-24.04-arm
            backend: cpu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            backend: vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check loader/catalog sync
        run: |
          python3 tools/check_loader_catalog_sync.py --self-test
          python3 tools/check_loader_catalog_sync.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build glslc libvulkan-dev spirv-headers

      - name: Build package
        run: |
          scripts/package_linux_prebuilt.sh \
            --backend "${{ matrix.backend }}" \
            --arch "${{ matrix.arch }}" \
            --jobs "$(nproc)"

      - name: Smoke test
        run: build/prebuilt/audiocpp-linux-${{ matrix.arch }}-${{ matrix.backend }}/audiocpp_cli --help

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: audiocpp-linux-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            build/prebuilt/*.tar.gz
            build/prebuilt/*.sha256
          if-no-files-found: error

  build-windows:
    name: Windows x86_64 CPU
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check loader/catalog sync
        shell: pwsh
        run: |
          python tools/check_loader_catalog_sync.py --self-test
          python tools/check_loader_catalog_sync.py

      - name: Build package
        shell: pwsh
        run: |
          .\scripts\package_windows_prebuilt.ps1 `
            -Package cpu `
            -Profile balance `
            -Jobs $env:NUMBER_OF_PROCESSORS

      - name: Smoke test
        shell: pwsh
        run: .\build\prebuilt\audiocpp-windows-cpu-balance\audiocpp_cli.exe --help

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = Get-Item .\build\prebuilt\audiocpp-windows-cpu-balance.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          "$hash *$($zip.Name)" |
            Set-Content -Encoding ascii "$($zip.FullName).sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: audiocpp-windows-x86_64-cpu
          path: |
            build/prebuilt/*.zip
            build/prebuilt/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release packages
    if: github.event_name == 'push'
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: audiocpp-*
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber

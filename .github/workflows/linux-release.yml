name: Release packages

on:
  push:
    tags:
      - "v*"
      - "release-*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }} ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            backend: cpu
          - arch: x86_64
            runner: ubuntu-24.04
            backend: vulkan
          - arch: aarch64
            runner: ubuntu-24.04-arm
            backend: cpu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            backend: vulkan

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check loader/catalog sync
        run: |
          python3 tools/check_loader_catalog_sync.py --self-test
          python3 tools/check_loader_catalog_sync.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build glslc libvulkan-dev spirv-headers

      - name: Build package
        run: |
          scripts/package_linux_prebuilt.sh \
            --backend "${{ matrix.backend }}" \
            --arch "${{ matrix.arch }}" \
            --jobs "$(nproc)"

      - name: Smoke test
        run: build/prebuilt/audiocpp-linux-${{ matrix.arch }}-${{ matrix.backend }}/audiocpp_cli --help

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: audiocpp-linux-${{ matrix.arch }}-${{ matrix.backend }}
          path: |
            build/prebuilt/*.tar.gz
            build/prebuilt/*.sha256
          if-no-files-found: error

  build-windows:
    name: Windows x86_64 ${{ matrix.backend }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: CPU
            package: cpu
          - backend: Vulkan
            package: vulkan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check loader/catalog sync
        shell: pwsh
        run: |
          python tools/check_loader_catalog_sync.py --self-test
          python tools/check_loader_catalog_sync.py

      - name: Install Vulkan SDK
        if: matrix.package == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "Chocolatey installed vulkan-sdk but C:\VulkanSDK was not found."
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Build package
        shell: pwsh
        run: |
          .\scripts\package_windows_prebuilt.ps1 `
            -Package ${{ matrix.package }} `
            -Profile balance `
            -Jobs $env:NUMBER_OF_PROCESSORS

      - name: Smoke test
        shell: pwsh
        run: .\build\prebuilt\audiocpp-windows-${{ matrix.package }}-balance\audiocpp_cli.exe --help

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = Get-Item .\build\prebuilt\audiocpp-windows-${{ matrix.package }}-balance.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          "$hash *$($zip.Name)" |
            Set-Content -Encoding ascii "$($zip.FullName).sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: audiocpp-windows-x86_64-${{ matrix.package }}
          path: |
            build/prebuilt/*.zip
            build/prebuilt/*.sha256
          if-no-files-found: error

  build-windows-cuda:
    name: Windows x86_64 CUDA 13
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check loader/catalog sync
        shell: pwsh
        run: |
          python tools/check_loader_catalog_sync.py --self-test
          python tools/check_loader_catalog_sync.py

      - name: Install CUDA Toolkit
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "13.0.2"
          method: network

      - name: Build package
        shell: pwsh
        run: |
          .\scripts\package_windows_prebuilt.ps1 `
            -Package cuda `
            -Profile balance `
            -CudaArchitectures default `
            -Jobs $env:NUMBER_OF_PROCESSORS

      - name: Smoke test
        shell: pwsh
        run: .\build\prebuilt\audiocpp-windows-cuda-balance\audiocpp_cli.exe --help

      - name: Create checksum
        shell: pwsh
        run: |
          $zip = Get-Item .\build\prebuilt\audiocpp-windows-cuda-balance.zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLowerInvariant()
          "$hash *$($zip.Name)" |
            Set-Content -Encoding ascii "$($zip.FullName).sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: audiocpp-windows-x86_64-cuda
          path: |
            build/prebuilt/*.zip
            build/prebuilt/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release packages
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, build-windows-cuda]
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: audiocpp-*
          path: dist
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' assets < <(find dist -type f -print0)
          if [[ "${#assets[@]}" -ne 14 ]]; then
            printf 'Expected 14 release files, found %s:\n' "${#assets[@]}" >&2
            printf '  %s\n' "${assets[@]}" >&2
            exit 1
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          for asset in "${assets[@]}"; do
            gh release upload "$TAG" "$asset" --clobber
          done
